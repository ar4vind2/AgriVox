name: agrivox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  permission_handler: ^11.3.1
  flutter_riverpod: ^3.4.3
  image: ^4.9.2
  tflite_flutter: ^0.12.1

  # SQLite Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Malayalam Voice / Text-to-Speech
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/database/